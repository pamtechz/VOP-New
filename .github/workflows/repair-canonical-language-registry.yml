name: Repair canonical language registry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'fix: canonical language registry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text()
          old = "onChangeLanguage={language => { setActiveLang(language); setActiveLanguage(language); setStudyError(''); }}"
          new = "onChangeLanguage={language => { setActiveLang(language); setActiveLanguage(language); setUiLocale(language); setStudyError(''); }}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/components/layout/Header.tsx')
          s = p.read_text()
          s = s.replace("import { getAvailableLanguages, getTranslation } from '../../services/i18n';", "import { getAvailableLanguages, getTranslation, useLocalization } from '../../services/i18n';")
          old = "  const t = (key: string, fallback?: string) => getTranslation(key, activeLanguage, settings?.customTranslations, fallback);\n  const availableLanguages = getAvailableLanguages(settings);"
          new = "  const t = (key: string, fallback?: string) => getTranslation(key, activeLanguage, settings?.customTranslations, fallback);\n  useLocalization(settings);\n  const availableLanguages = getAvailableLanguages(settings);"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/services/i18n.ts')
          s = p.read_text()
          start = s.index('export const getAvailableLanguages =')
          end = s.index('\n\nexport const getAvailableUiLocales', start)
          replacement = '''export const getAvailableLanguages = (settings?: AppSettings): CustomLanguage[] => {
  const fromRegistry = getAvailableUiLocales();
  const source = fromRegistry.length > 0 ? fromRegistry : (settings?.customLanguages ?? []);
  const map = new Map<string, CustomLanguage>();
  source.forEach(language => {
    if (!language || language.enabled === false) return;
    const code = String(language.code || '').trim().toLowerCase();
    if (!code) return;
    const name = String(language.name || code).trim();
    const nativeName = String(language.nativeName || name).trim();
    map.set(code, { code, name, nativeName, enabled: true, sortOrder: Number(language.sortOrder ?? 0), rtl: language.rtl === true });
  });
  return [...map.values()].sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0) || a.name.localeCompare(b.name));
};'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('src/services/adminFirestore.ts')
          s = p.read_text()
          start = s.index('export const saveLanguageToFirestore =')
          end = s.index('\n\nexport const updateLanguageStatusInFirestore', start)
          replacement = '''export const saveLanguageToFirestore = async (language: CustomLanguage): Promise<void> => {
  const user = auth?.currentUser;
  if (!user) throw new Error('Sign in first.');
  const token = await user.getIdToken();
  const code = String(language.code || '').trim().toLowerCase();
  const name = String(language.name || '').trim();
  const nativeName = String(language.nativeName || name).trim();
  if (!code) throw new Error('A language code is required.');
  if (!/^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/i.test(code)) throw new Error('Use a valid language code such as bem or en.');
  if (!name) throw new Error('A language name is required.');
  const response = await fetch('/api/admin/languages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ action: 'upsert', id: code, code, name, nativeName, enabled: language.enabled !== false, rtl: language.rtl === true, sortOrder: Number(language.sortOrder || 0) }),
  });
  const payload = await response.json().catch(() => ({})) as { error?: string };
  if (!response.ok) throw new Error(payload.error || 'Could not save the language.');
};'''
          s = s[:start] + replacement + s[end:]
          s = s.replace("fetch('/api/admin/content', {", "fetch('/api/admin/languages', {", 2)
          s = s.replace("body: JSON.stringify({\n      action: 'upsert',\n      collection: 'languages',\n      id,\n      data: { code: code.toUpperCase(), languageCode: id, enabled, sharingScope: 'shared' },\n    }),", "body: JSON.stringify({ action: 'status', id, code: id, enabled }),")
          s = s.replace("body: JSON.stringify({ action: 'delete', collection: 'languages', id }),", "body: JSON.stringify({ action: 'delete', id, code: id }),")
          p.write_text(s)
          PY

      - name: Add canonical language API
        run: |
          cat > api/admin/languages.ts <<'EOF2'
          import { FieldValue } from 'firebase-admin/firestore';
          import { authenticateTenant, getAdminDb, writeTenantAudit } from '../../server/tenant.js';

          type Request = { method?: string; headers?: Record<string, string | string[] | undefined>; body?: unknown };
          type Response = { status:(code:number)=>Response; json:(body:unknown)=>void };
          const CODE_RE = /^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/i;

          export default async function handler(req: Request, res: Response) {
            try {
              const ctx = await authenticateTenant(req);
              if (!ctx.isSuperAdmin) throw new Error('Only the VOP Super Admin can manage global languages.');
              if (req.method !== 'POST') return res.status(405).json({error:'Method not allowed.'});
              const body = req.body && typeof req.body === 'object' ? req.body as Record<string,unknown> : {};
              const action = String(body.action || '');
              const rawCode = String(body.code || body.id || '').trim().toLowerCase();
              if (!rawCode || !CODE_RE.test(rawCode)) throw new Error('A valid language code is required.');
              const db = getAdminDb();
              const languageRef = db.doc(`languages/${rawCode}`);
              const localeRef = db.doc(`locales/${rawCode}`);

              if (action === 'upsert') {
                const name = String(body.name || '').trim();
                const nativeName = String(body.nativeName || name).trim();
                if (!name) throw new Error('Language name is required.');
                const existing = await languageRef.get();
                const data = {
                  code: rawCode,
                  languageCode: rawCode,
                  name,
                  nativeName,
                  enabled: body.enabled !== false,
                  rtl: body.rtl === true,
                  sortOrder: Number(body.sortOrder || 0),
                  sharingScope: 'shared',
                  organizationId: '',
                  ownerUid: ctx.auth.uid,
                  updatedAt: FieldValue.serverTimestamp(),
                  updatedBy: ctx.auth.uid,
                  ...(existing.exists ? {} : {createdAt: FieldValue.serverTimestamp()}),
                };
                await languageRef.set(data, {merge:true});
                await localeRef.set({code:rawCode,name,nativeName,enabled:data.enabled,rtl:data.rtl,direction:data.rtl?'rtl':'ltr',fallback:'en',updatedAt:FieldValue.serverTimestamp(),updatedBy:ctx.auth.uid},{merge:true});
                await writeTenantAudit(ctx,'language.upsert',`languages/${rawCode}`,existing.exists ? existing.data() : undefined,{code:rawCode,name});
                return res.status(200).json({ok:true,item:{id:rawCode,code:rawCode,languageCode:rawCode,name,nativeName,enabled:data.enabled,rtl:data.rtl,sortOrder:data.sortOrder}});
              }

              if (action === 'status') {
                const snap = await languageRef.get();
                if (!snap.exists) throw new Error('Language not found.');
                const enabled = body.enabled === true;
                await languageRef.set({enabled,updatedAt:FieldValue.serverTimestamp(),updatedBy:ctx.auth.uid},{merge:true});
                await localeRef.set({enabled,updatedAt:FieldValue.serverTimestamp(),updatedBy:ctx.auth.uid},{merge:true});
                return res.status(200).json({ok:true,code:rawCode,enabled});
              }

              if (action === 'delete') {
                const snap = await languageRef.get();
                if (!snap.exists) return res.status(404).json({error:'Language not found.'});
                await languageRef.delete();
                await localeRef.delete();
                await writeTenantAudit(ctx,'language.delete',`languages/${rawCode}`,snap.data(),undefined);
                return res.status(200).json({ok:true,code:rawCode});
              }

              return res.status(400).json({error:'Unsupported language action.'});
            } catch (error) {
              const message = error instanceof Error ? error.message : 'Language operation failed.';
              const status = /sign in/i.test(message) ? 401 : /Only|permission|membership/i.test(message) ? 403 : 400;
              return res.status(status).json({error:message});
            }
          }
          EOF2

      - name: Canonicalize localization registry API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/localization.ts')
          s=p.read_text()
          old="""        const map = new Map<string, Record<string, unknown>>();
        localesSnap.docs.forEach(doc => {
          map.set(doc.id.toLowerCase(), { id: doc.id, ...doc.data() });
        });
        languagesSnap.docs.forEach(doc => {
          const id = doc.id.toLowerCase();
          const data = doc.data() || {};
          if (!map.has(id) || (data.name && !map.get(id)?.name)) {
            map.set(id, {
              id,
              code: String(data.code || id).trim().toLowerCase(),
              name: String(data.name || id).trim(),
              nativeName: String(data.nativeName || data.name || id).trim(),
              enabled: data.enabled !== false,
              sortOrder: Number(data.sortOrder || 0),
              direction: data.rtl ? 'rtl' : 'ltr',
            });
          }
        });
"""
          new="""        const map = new Map<string, Record<string, unknown>>();
        languagesSnap.docs.forEach(doc => {
          const data = doc.data() || {};
          const code = String(data.code || data.languageCode || doc.id).trim().toLowerCase();
          if (!LOCALE_RE.test(code)) return;
          const locale = localesSnap.docs.find(item => item.id.toLowerCase() === code)?.data() || {};
          map.set(code, {
            id: code,
            code,
            name: String(data.name || locale.name || code).trim(),
            nativeName: String(data.nativeName || locale.nativeName || data.name || code).trim(),
            enabled: data.enabled !== false && locale.enabled !== false,
            sortOrder: Number(data.sortOrder ?? locale.sortOrder ?? 0),
            direction: data.rtl === true || locale.rtl === true ? 'rtl' : 'ltr',
          });
        });
"""
          if old not in s: raise SystemExit('localization registry block not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/components/layout/Header.tsx src/services/i18n.ts src/services/adminFirestore.ts api/admin/languages.ts api/localization.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: canonical language registry and firestore CRUD"
          git push origin main

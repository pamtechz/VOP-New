name: Repair canonical language v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard recursive commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q 'fix: canonical language registry'; then echo skip=true >> "$GITHUB_OUTPUT"; else echo skip=false >> "$GITHUB_OUTPUT"; fi
      - name: Patch canonical language flow
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace("onChangeLanguage={language => { setActiveLang(language); setActiveLanguage(language); setStudyError(''); }}", "onChangeLanguage={language => { setActiveLang(language); setActiveLanguage(language); setUiLocale(language); setStudyError(''); }}", 1)
          p.write_text(s)

          p=Path('src/components/layout/Header.tsx')
          s=p.read_text()
          s=s.replace("import { getAvailableLanguages, getTranslation } from '../../services/i18n';", "import { getAvailableLanguages, getTranslation, useLocalization } from '../../services/i18n';", 1)
          old="  const t = (key: string, fallback?: string) => getTranslation(key, activeLanguage, settings?.customTranslations, fallback);\n  const availableLanguages = getAvailableLanguages(settings);"
          new="  const t = (key: string, fallback?: string) => getTranslation(key, activeLanguage, settings?.customTranslations, fallback);\n  useLocalization(settings);\n  const availableLanguages = getAvailableLanguages(settings);"
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/services/i18n.ts')
          s=p.read_text()
          start=s.index('export const getAvailableLanguages =')
          end=s.index('\n\nexport const getAvailableUiLocales',start)
          replacement='''export const getAvailableLanguages = (settings?: AppSettings): CustomLanguage[] => {\n  const registry = getAvailableUiLocales();\n  const source = registry.length > 0 ? registry : (settings?.customLanguages ?? []);\n  const map = new Map<string, CustomLanguage>();\n  source.forEach(language => {\n    if (!language || language.enabled === false) return;\n    const code = String(language.code || '').trim().toLowerCase();\n    if (!code) return;\n    const name = String(language.name || code).trim();\n    const nativeName = String(language.nativeName || name).trim();\n    map.set(code, { code, name, nativeName, enabled: true, sortOrder: Number(language.sortOrder ?? 0), rtl: language.rtl === true });\n  });\n  return [...map.values()].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0)||a.name.localeCompare(b.name));\n};'''
          p.write_text(s[:start]+replacement+s[end:])

          p=Path('src/services/adminFirestore.ts')
          s=p.read_text()
          start=s.index('export const saveLanguageToFirestore =')
          end=s.index('\n\nexport const updateLanguageStatusInFirestore',start)
          replacement='''export const saveLanguageToFirestore = async (language: CustomLanguage): Promise<void> => {\n  const user=auth?.currentUser;\n  if (!user) throw new Error('Sign in first.');\n  const token=await user.getIdToken();\n  const code=String(language.code||'').trim().toLowerCase();\n  const name=String(language.name||'').trim();\n  const nativeName=String(language.nativeName||name).trim();\n  if(!code) throw new Error('A language code is required.');\n  if(!/^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/i.test(code)) throw new Error('Use a valid language code such as bem or en.');\n  if(!name) throw new Error('A language name is required.');\n  const response=await fetch('/api/admin/languages',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'upsert',id:code,code,name,nativeName,enabled:language.enabled!==false,rtl:language.rtl===true,sortOrder:Number(language.sortOrder||0)})});\n  const payload=await response.json().catch(()=>({})) as {error?:string};\n  if(!response.ok) throw new Error(payload.error||'Could not save the language.');\n};'''
          s=s[:start]+replacement+s[end:]
          s=s.replace("fetch('/api/admin/content', {", "fetch('/api/admin/languages', {", 2)
          s=s.replace("body: JSON.stringify({\n      action: 'upsert',\n      collection: 'languages',\n      id,\n      data: { code: code.toUpperCase(), languageCode: id, enabled, sharingScope: 'shared' },\n    }),", "body: JSON.stringify({ action: 'status', id, code: id, enabled }),")
          s=s.replace("body: JSON.stringify({ action: 'delete', collection: 'languages', id }),", "body: JSON.stringify({ action: 'delete', id, code: id }),")
          p.write_text(s)
          PY
      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/components/layout/Header.tsx src/services/i18n.ts src/services/adminFirestore.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: canonical language registry and firestore CRUD'
          git push origin main

name: VOP Web Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/real-admin-data-and-management-ui

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

name: Refresh npm lockfile

on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity
      - feat/plate-curriculum-authoring-review-20260929

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[skip lockfile]')"
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: pwsh
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only the KASAINSTITUTE Windows self-hosted runner may execute VOP jobs (got '$env:VOP_ACTUAL_RUNNER')."
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: pwsh
        run: |
          & git diff --quiet -- package-lock.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfile already current."
            exit 0
          }
          & git config user.name "VOP Lockfile Bot"
          & git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          & git add package-lock.json
          & git commit -m "Refresh npm lockfile [skip lockfile]"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the refreshed npm lockfile." }
          & git push origin ("HEAD:" + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw "Could not push the refreshed lockfile." }

name: Refresh npm lockfile

on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity

permissions:
  contents: write

jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, '[skip lockfile]')"
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "VOP Lockfile Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh npm lockfile [skip lockfile]"
          git push origin HEAD:${{ github.ref_name }}

name: Complete admin UI and enrollment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) AdminRecordsPanel: generic hierarchy/material editor becomes a top-button modal.
          p = root / 'src/pages/AdminRecordsPanel.tsx'
          s = p.read_text()
          assert "const [saving, setSaving] = useState(false);" in s
          s = s.replace("const [saving, setSaving] = useState(false);", "const [saving, setSaving] = useState(false);\n  const [editorOpen, setEditorOpen] = useState(false);", 1)
          s = s.replace("    setEditingId(null);\n    setForm(blankForm(kind));\n  };", "    setEditingId(null);\n    setForm(blankForm(kind));\n    setEditorOpen(true);\n  };", 1)
          s = s.replace("    setForm({ ...blankForm(kind), ...next });\n  };", "    setForm({ ...blankForm(kind), ...next });\n    setEditorOpen(true);\n  };", 1)
          s = s.replace("      setMessage(editingId ? 'Record updated.' : 'Record created.');\n      openNew();", "      setMessage(editingId ? 'Record updated.' : 'Record created.');\n      setEditingId(null);\n      setForm(blankForm(kind));\n      setEditorOpen(false);", 1)
          old = '''      <div className="vop-admin-record-layout">\n        <div className="vop-table-wrap">\n          <table className="vop-table">\n            <thead><tr>{tableHeaders(kind).map(header=><th key={header}>{header}</th>)}<th>Actions</th></tr></thead>\n            <tbody>\n              {visibleRecords.map((record,index)=><tr key={record.id}>\n                <td>{index+1}</td>\n                {tableCells(kind, record)}\n                <td><div style={{display:'flex',gap:7}}><button className="vop-actions" type="button" disabled={record.canEdit === false || !canUpdate} title={record.canEdit === false ? 'Owned by another contributor' : !canUpdate ? 'Permission denied' : 'Edit'} onClick={()=>edit(record)}><Edit3 size={15}/></button><button className="vop-actions" type="button" disabled={record.canEdit === false || !canDelete} title={record.canEdit === false ? 'Owned by another contributor' : !canDelete ? 'Permission denied' : 'Delete'} onClick={()=>void remove(record.id)}><Trash2 size={15}/></button></div></td>\n              </tr>)}\n            </tbody>\n          </table>\n          {visibleRecords.length===0 && <div className="vop-empty">No {primaryTitle.toLowerCase()} records are configured.</div>}\n        </div>\n        <form className="vop-card vop-form-card" onSubmit={save}>\n          <div className="vop-section-title"><div><h2>{actionLabel}</h2><p>Changes are saved securely to the configured content store.</p></div><div className="vop-heading-icon" style={{width:46,height:46}}><Plus size={22}/></div></div>\n          <Fields kind={kind} form={form} setForm={setForm} records={[...records, ...relatedRecords]}/>\n          <div style={{display:'flex',gap:9,marginTop:18}}><button type="button" className="vop-secondary" style={{flex:1}} onClick={openNew}>{t('common.clear','Clear')}</button><button type="submit" className="vop-primary" style={{flex:1,justifyContent:'center'}} disabled={saving}><Save size={16}/>{saving?'Saving…':actionLabel}</button></div>\n        </form>\n      </div>'''
          new = '''      <div className="vop-admin-record-layout vop-admin-record-list-only">\n        <div className="vop-table-wrap">\n          <table className="vop-table">\n            <thead><tr>{tableHeaders(kind).map(header=><th key={header}>{header}</th>)}<th>Actions</th></tr></thead>\n            <tbody>\n              {visibleRecords.map((record,index)=><tr key={record.id}>\n                <td>{index+1}</td>\n                {tableCells(kind, record)}\n                <td><div style={{display:'flex',gap:7}}><button className="vop-actions" type="button" disabled={record.canEdit === false || !canUpdate} title={record.canEdit === false ? 'Owned by another contributor' : !canUpdate ? 'Permission denied' : 'Edit'} onClick={()=>edit(record)}><Edit3 size={15}/></button><button className="vop-actions" type="button" disabled={record.canEdit === false || !canDelete} title={record.canEdit === false ? 'Owned by another contributor' : !canDelete ? 'Permission denied' : 'Delete'} onClick={()=>void remove(record.id)}><Trash2 size={15}/></button></div></td>\n              </tr>)}\n            </tbody>\n          </table>\n          {visibleRecords.length===0 && <div className="vop-empty">No {primaryTitle.toLowerCase()} records are configured.</div>}\n        </div>\n      </div>\n      {editorOpen && <div className="vop-admin-editor-backdrop" onMouseDown={event=>{if(event.target===event.currentTarget)setEditorOpen(false)}}>\n        <form className="vop-admin-editor-modal" onSubmit={save}>\n          <div className="vop-section-title"><div><h2>{actionLabel}</h2><p>Changes are saved securely to the configured content store.</p></div><button type="button" className="vop-icon-button" onClick={()=>setEditorOpen(false)} aria-label="Close"><X size={18}/></button></div>\n          <div className="vop-admin-editor-scroll"><Fields kind={kind} form={form} setForm={setForm} records={[...records, ...relatedRecords]}/></div>\n          <div style={{display:'flex',gap:9,marginTop:18}}><button type="button" className="vop-secondary" style={{flex:1}} onClick={()=>{setEditorOpen(false);setEditingId(null);setForm(blankForm(kind))}}>{t('common.cancel','Cancel')}</button><button type="submit" className="vop-primary" style={{flex:1,justifyContent:'center'}} disabled={saving}><Save size={16}/>{saving?'Saving…':actionLabel}</button></div>\n        </form>\n      </div>}'''
          assert old in s, 'generic editor block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Announcement editor becomes a modal instead of a permanent right column.
          p = root / 'src/pages/AdminRecordsPanel.tsx'
          s = p.read_text()
          marker = "  const [filter, setFilter] = useState<'all'|'published'|'scheduled'|'draft'|'archived'>('all');"
          assert marker in s
          s = s.replace(marker, marker + "\n  const [editorOpen, setEditorOpen] = useState(false);", 1)
          s = s.replace("    <div className=\"vop-ann-admin-head\"><div className=\"vop-ann-admin-title\"><div><Megaphone size={27}/></div><section><span>{t('admin.announcements','Announcements')}</span><h1>{t('admin.manage_announcements','Manage Announcements')}</h1><p>{t('admin.manage_announcements_hint','Create, manage and publish announcements for learners and users.')}</p></section></div><button className=\"vop-primary\" type=\"button\" onClick={openNew} disabled={!canCreate}><Plus size={17}/> New Announcement</button></div>", "    <div className=\"vop-ann-admin-head\"><div className=\"vop-ann-admin-title\"><div><Megaphone size={27}/></div><section><span>{t('admin.announcements','Announcements')}</span><h1>{t('admin.manage_announcements','Manage Announcements')}</h1><p>{t('admin.manage_announcements_hint','Create, manage and publish announcements for learners and users.')}</p></section></div><button className=\"vop-primary\" type=\"button\" onClick={()=>{openNew();setEditorOpen(true)}} disabled={!canCreate}><Plus size={17}/> New Announcement</button></div>", 1)
          s = s.replace("  const visible = records.filter(item => {", "  const openEdit = (item: AdminRecord) => { edit(item); setEditorOpen(true); };\n  useEffect(()=>{ if(message) setEditorOpen(false); }, [message]);\n\n  const visible = records.filter(item => {", 1)
          s = s.replace("onClick={()=>edit(item)}", "onClick={()=>openEdit(item)}", 1)
          old_form_start = '<form className="vop-card vop-form-card" onSubmit={save}><div className="vop-section-title"><div><h2>{editingId?\'Edit Announcement\':\'New Announcement\'}</h2>'
          assert old_form_start in s
          # Remove the inline announcement form up to the closing form before error alerts.
          start = s.index(old_form_start)
          end_marker = '</form>\n    </div>\n    {error&&'
          end = s.index(end_marker, start)
          form_block = s[start:end+len('</form>')]
          modal = '''<div className="vop-ann-editor-backdrop" onMouseDown={event=>{if(event.target===event.currentTarget)setEditorOpen(false)}}>\n        <form className="vop-ann-editor-modal vop-card vop-form-card" onSubmit={save}>\n          <div className="vop-section-title"><div><h2>{editingId?'Edit Announcement':'New Announcement'}</h2><p>Use actual configured content. Nothing is inserted as sample data.</p></div><button type="button" className="vop-icon-button" onClick={()=>setEditorOpen(false)}><X size={18}/></button></div>\n          {field('title','Title *')}{field('tag','Category / Tag')}{field('targetAudience','Target Audience')}{area('description','Description *')}{field('imageUrl','Image URL','url')}{field('actionText','Action Text')}{field('actionUrl','Action URL','url')}{field('scheduledAt','Scheduled For','datetime-local')}<div className="vop-setting-row"><div><div className="vop-setting-name">{t('admin.published','Published')}</div><div className="vop-setting-help">Published announcements appear in the public announcements experience.</div></div><button type="button" className={'vop-toggle '+(form.published?'on':'')} onClick={()=>setForm(current=>({...current,published:!Boolean(current.published)}))}><span/></button></div><div style={{display:'flex',gap:8,marginTop:14}}><button className="vop-secondary" type="button" onClick={()=>setEditorOpen(false)}>{t('common.cancel','Cancel')}</button><button className="vop-primary" type="submit" disabled={saving || (editingId ? !canUpdate : !canCreate)}><Save size={16}/>{saving?'Saving…':editingId?'Save Changes':'Create Announcement'}</button></div>\n        </form>\n      </div>'''
          s = s[:start] + s[end+len('</form>'):] + '\n    {editorOpen && ' + modal + '}\n'
          p.write_text(s)

          # 3) Radio: keep the existing Broadcast Studio modal and remove the permanent right-side add card.
          p = root / 'src/pages/AdminRecordsPanel.tsx'
          s = p.read_text()
          start_marker = '          <div className="vop-radio-admin-add-card">'
          start = s.find(start_marker)
          if start >= 0:
            end = s.find('          </div>\n        </div>\n      ) : (', start)
            assert end >= 0, 'radio add-card end not found'
            # The first matching end is the outer card close; use the exact section through workspace close.
            block = s[start:end]
            s = s[:start] + s[end:]
          p.write_text(s)

          # 4) Radio publish is persisted as a real boolean server-side.
          p = root / 'api/admin/content.ts'
          s = p.read_text()
          old = "          ...incoming,\n          id,\n          organizationId: '',"
          new = "          ...incoming,\n          id,\n          ...(Object.prototype.hasOwnProperty.call(incoming, 'published') ? { published: incoming.published === true } : {}),\n          organizationId: '',"
          assert old in s
          s = s.replace(old, new, 1)
          old2 = "          ...incoming,\n          id,\n          organizationId: effectiveOrganizationId,"
          new2 = "          ...incoming,\n          id,\n          ...(Object.prototype.hasOwnProperty.call(incoming, 'published') ? { published: incoming.published === true } : {}),\n          organizationId: effectiveOrganizationId,"
          assert old2 in s
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          # 5) Candidate enrollment API: create the account and course enrollment atomically from one admin workflow.
          p = root / 'api/admin/candidates.ts'
          s = p.read_text()
          s = s.replace("import { FieldValue } from 'firebase-admin/firestore';", "import { FieldValue } from 'firebase-admin/firestore';\nimport { getAuth } from 'firebase-admin/auth';", 1)
          old = "    if (body.action !== 'updateBaptism') return response.status(400).json({ error: 'Unsupported candidate action.' });"
          new = '''    if (body.action === 'enroll') {\n      const requestedOrganizationId = typeof body.organizationId === 'string' ? body.organizationId.trim() : '';\n      const ctx = await authenticateTenant(request, requestedOrganizationId || undefined);\n      await requirePermission(ctx, 'users', 'create');\n      if (ctx.tenantType === 'hierarchy') {\n        if (!requestedOrganizationId || !(await organizationInHierarchyScope(ctx, requestedOrganizationId))) return response.status(403).json({ error: 'The selected organization is outside your hierarchy scope.' });\n      } else {\n        requireOrgRole(ctx, ['owner','admin']);\n      }\n      const organizationId = ctx.organizationId || requestedOrganizationId;\n      if (!organizationId) throw new Error('An organization is required for candidate enrollment.');\n      const displayName = typeof body.displayName === 'string' ? body.displayName.trim() : '';\n      const email = typeof body.email === 'string' ? body.email.trim().toLowerCase() : '';\n      const phoneNumber = typeof body.phoneNumber === 'string' ? body.phoneNumber.trim() : '';\n      const password = typeof body.password === 'string' ? body.password : '';\n      const guideId = typeof body.guideId === 'string' ? body.guideId.trim() : '';\n      if (!displayName || !email || !guideId) return response.status(400).json({ error: 'Full name, email and course are required.' });\n      if (password && password.length < 6) return response.status(400).json({ error: 'Password must contain at least 6 characters.' });\n      const guideRef = ctx.db.doc('guides/' + guideId);\n      const guide = await guideRef.get();\n      if (!guide.exists) throw new Error('The selected course was not found.');\n      const guideData = guide.data() || {};\n      if (String(guideData.organizationId || '') !== organizationId) throw new Error('The selected course does not belong to this organization.');\n      if (guideData.published !== true || guideData.archived === true) throw new Error('Only a published active course can be used for enrollment.');\n      const authService = getAuth((await import('firebase-admin/app')).getApps()[0]);\n      let account;\n      let created = false;\n      try {\n        account = await authService.getUserByEmail(email);\n      } catch (error) {\n        const code = String((error as {code?:unknown})?.code || '');\n        if (code !== 'auth/user-not-found') throw error;\n        account = await authService.createUser({ email, displayName, ...(phoneNumber ? { phoneNumber } : {}), ...(password ? { password } : {}), disabled:false });\n        created = true;\n      }\n      const candidateRef = ctx.db.doc('users/' + account.uid);\n      const existingProfile = await candidateRef.get();\n      const existing = existingProfile.exists ? existingProfile.data() || {} : {};\n      const existingOrg = String(existing.organizationId || '').trim();\n      if (existingOrg && existingOrg !== organizationId) throw new Error('This email already belongs to another organization.');\n      const now = new Date().toISOString();\n      const information = { ...(existing.information as Record<string, unknown> || {}), enrollmentDate: String((existing.information as Record<string, unknown> || {}).enrollmentDate || now), graduating:false, graduated:false, baptismCandidate:Boolean((existing.information as Record<string, unknown> || {}).baptismCandidate), baptized:Boolean((existing.information as Record<string, unknown> || {}).baptized) };\n      const progress = { ...(existing.progress as Record<string, unknown> || {}), discoverProgress:Number((existing.progress as Record<string, unknown> || {}).discoverProgress || 0), completedGuidesCount:Number((existing.progress as Record<string, unknown> || {}).completedGuidesCount || 0), totalGuidesCount:Number((existing.progress as Record<string, unknown> || {}).totalGuidesCount || 0), guideScores:(existing.progress as Record<string, unknown> || {}).guideScores || {}, completedLessons:Array.isArray((existing.progress as Record<string, unknown> || {}).completedLessons) ? (existing.progress as Record<string, unknown>).completedLessons : [] };\n      await ctx.db.runTransaction(async transaction => {\n        transaction.set(candidateRef, { uid:account.uid, email, displayName:displayName || account.displayName || email.split('@')[0], ...(phoneNumber ? {phoneNumber} : {}), role:String(existing.role || 'student'), userType:'learner', organizationId, organizationRole:'learner', information, progress, updatedAt:FieldValue.serverTimestamp(), createdAt:existing.createdAt || FieldValue.serverTimestamp() }, { merge:true });\n        transaction.set(ctx.db.doc('organizations/' + organizationId + '/members/' + account.uid), { uid:account.uid, organizationId, role:'learner', active:true, invitedBy:ctx.auth.uid, joinedAt:String(existing.joinedAt || now), updatedAt:now }, { merge:true });\n        transaction.set(ctx.db.doc('courseEnrollments/' + organizationId + '_' + account.uid + '_' + guideId), { uid:account.uid, organizationId, guideId, source:'admin', enrolledBy:ctx.auth.uid, enrolledAt:FieldValue.serverTimestamp(), updatedAt:FieldValue.serverTimestamp(), status:'active' }, { merge:true });\n      });\n      await authService.setCustomUserClaims(account.uid, { role:String(existing.role || 'student'), organizationId, organizationRole:'learner' });\n      const resetLink = !password ? await authService.generatePasswordResetLink(email).catch(() => null) : null;\n      await writeTenantAudit(ctx, 'candidate.enroll', 'users/' + account.uid, undefined, { organizationId, guideId, created });\n      return response.status(200).json({ ok:true, created, resetLink, candidate:{uid:account.uid,email,displayName:displayName || account.displayName || email.split('@')[0],organizationId,guideId} });\n    }\n    if (body.action !== 'updateBaptism') return response.status(400).json({ error: 'Unsupported candidate action.' });'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 6) New candidate enrollment UI.
          candidate = root / 'src/pages/CandidateEnrollment.tsx'
          candidate.write_text(r'''import React, { useEffect, useState } from 'react';
import { Check, GraduationCap, Mail, Phone, Plus, UserPlus } from 'lucide-react';
import { auth } from '../lib/firebase';
import type { User } from '../types';

type Course = { id:string; title?:string; language?:string; published?:boolean; archived?:boolean; organizationId?:string; lessonCount?:number };

export default function CandidateEnrollment({ currentUser }: { currentUser: User }) {
  const [courses,setCourses]=useState<Course[]>([]);
  const [courseId,setCourseId]=useState('');
  const [organizationId,setOrganizationId]=useState(String(currentUser.organizationId || ''));
  const [organizations,setOrganizations]=useState<Array<{id:string;name:string}>>([]);
  const [name,setName]=useState('');
  const [email,setEmail]=useState('');
  const [phone,setPhone]=useState('');
  const [password,setPassword]=useState('');
  const [saving,setSaving]=useState(false);
  const [loading,setLoading]=useState(true);
  const [message,setMessage]=useState('');
  const [error,setError]=useState('');

  const request=async(action:string, collection:string, extra:Record<string,unknown>={})=>{
    if(!auth?.currentUser) throw new Error('Your session has expired. Sign in again.');
    const token=await auth.currentUser.getIdToken();
    const response=await fetch('/api/admin/content',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,collection,organizationId:organizationId || undefined,...extra})});
    const body=await response.json().catch(()=>({})) as {error?:string;items?:unknown[]};
    if(!response.ok) throw new Error(body.error || 'Request failed.');
    return body;
  };

  useEffect(()=>{
    void (async()=>{
      setLoading(true);setError('');
      try {
        if(!organizationId){
          if(['super_admin','union_admin','conference_admin','district_admin','church_admin'].includes(String(currentUser.role || ''))){
            const token=await auth.currentUser!.getIdToken();
            const response=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'listOrganizations'})});
            const body=await response.json().catch(()=>({})) as {items?:Array<{id:string;name:string}>;error?:string};
            if(!response.ok) throw new Error(body.error || 'Could not load organizations.');
            const list=body.items || []; setOrganizations(list); if(list[0]) setOrganizationId(list[0].id);
          }
        }
      } catch(e){setError(e instanceof Error?e.message:'Could not load organizations.');}
      finally{setLoading(false);}
    })();
  },[]);

  useEffect(()=>{
    if(!organizationId)return;
    void (async()=>{
      try {
        const body=await request('listGuides','guides');
        setCourses((body.items||[] as Course[]).filter((item:Course)=>item.published===true && item.archived!==true));
      } catch(e){setError(e instanceof Error?e.message:'Could not load courses.');}
    })();
  },[organizationId]);

  const submit=async(e:React.FormEvent)=>{
    e.preventDefault();setSaving(true);setError('');setMessage('');
    try {
      if(!organizationId||!courseId||!name.trim()||!email.trim()) throw new Error('Organization, course, full name and email are required.');
      if(password && password.length<6) throw new Error('Password must contain at least 6 characters.');
      if(!auth?.currentUser) throw new Error('Sign in again.');
      const token=await auth.currentUser.getIdToken();
      const response=await fetch('/api/admin/candidates',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'enroll',organizationId,displayName:name.trim(),email:email.trim(),phoneNumber:phone.trim(),password,guideId:courseId})});
      const body=await response.json().catch(()=>({})) as {error?:string;created?:boolean;resetLink?:string;candidate?:{displayName:string}};
      if(!response.ok) throw new Error(body.error || 'Candidate enrollment failed.');
      setMessage(body.created ? `Account created and ${body.candidate?.displayName || name.trim()} enrolled successfully.` : `Existing account enrolled successfully.`);
      setName('');setEmail('');setPhone('');setPassword('');setCourseId('');
    } catch(e){setError(e instanceof Error?e.message:'Candidate enrollment failed.');}
    finally{setSaving(false);}
  };

  return <div>
    <div className="vop-page-header"><div><div className="vop-breadcrumb"><UserPlus size={15}/> Administration / Candidates</div><h1>Add Candidate</h1><p>Create a learner account and enroll them into a published course from one page.</p></div></div>
    {message&&<div className="vop-toast"><Check size={16}/>{message}</div>}
    {error&&<div role="alert" style={{background:'#fff1f1',border:'1px solid #ffcaca',color:'#b42318',padding:12,borderRadius:11,marginBottom:14}}>{error}</div>}
    <form className="vop-card vop-form-card" onSubmit={submit}>
      <div className="vop-section-title"><div><h2>Candidate account & course enrollment</h2><p>All required account and enrollment information is completed here. The server creates the account, organization membership and course enrollment together.</p></div><div className="vop-heading-icon"><GraduationCap size={28}/></div></div>
      <div className="vop-form-grid">
        {organizations.length>0 && <div className="vop-field"><label>Organization *</label><select value={organizationId} onChange={e=>{setOrganizationId(e.target.value);setCourseId('')}}><option value="">Select organization</option>{organizations.map(item=><option key={item.id} value={item.id}>{item.name}</option>)}</select></div>}
        <div className="vop-field"><label>Course *</label><select value={courseId} onChange={e=>setCourseId(e.target.value)} disabled={loading||!organizationId}><option value="">Select a published course</option>{courses.map(course=><option key={course.id} value={course.id}>{course.title || course.id}{course.language ? ` · ${course.language.toUpperCase()}` : ''}</option>)}</select></div>
        <div className="vop-field"><label>Full name *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Candidate full name" required/></div>
        <div className="vop-field"><label>Email *</label><div style={{display:'flex',gap:8,alignItems:'center'}}><Mail size={16}/><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="candidate@example.org" required/></div></div>
        <div className="vop-field"><label>Phone</label><div style={{display:'flex',gap:8,alignItems:'center'}}><Phone size={16}/><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Optional phone number"/></div></div>
        <div className="vop-field"><label>Temporary password <small>(optional)</small></label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Leave empty to generate a reset link"/></div>
      </div>
      <div className="vop-setting-row" style={{marginTop:18}}><div><div className="vop-setting-name">Enrollment</div><div className="vop-setting-help">The candidate receives learner membership and an active course enrollment. No manual second step is required.</div></div><button className="vop-primary" type="submit" disabled={saving||loading||!courseId||!name.trim()||!email.trim()}><Plus size={17}/>{saving?'Creating & enrolling…':'Create account & enroll'}</button></div>
    </form>
  </div>;
}
''')

          # 7) Wire the new candidate page into AdminPage.
          p = root / 'src/pages/AdminPage.tsx'
          s = p.read_text()
          if "import CandidateEnrollment from './CandidateEnrollment';" not in s:
            anchor = "import OrganizationManagement from './OrganizationManagement';"
            assert anchor in s
            s = s.replace(anchor, anchor + "\nimport CandidateEnrollment from './CandidateEnrollment';", 1)
          # Replace the existing candidates branch with the new dedicated workflow.
          pattern = r"\{activeTab==='candidates'&&.*?\}\n\s*\{activeTab==='curriculum'"
          replacement = "{activeTab==='candidates'&&<CandidateEnrollment currentUser={currentUser}/>}\n        {activeTab==='curriculum'"
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert count == 1, 'candidate render branch not found'
          p.write_text(s2)

          # 8) Languages: make the editor an overlay instead of a permanent right column.
          p = root / 'src/pages/AdminPage.tsx'
          s = p.read_text()
          marker = "  const [editingLanguage, setEditingLanguage] = useState<string | null>(null);"
          if "const [languageEditorOpen" not in s:
            assert marker in s
            s = s.replace(marker, marker + "\n  const [languageEditorOpen, setLanguageEditorOpen] = useState(false);", 1)
          s = s.replace("      setEditingLanguage(language.code);\n      setLanguageDraft({", "      setEditingLanguage(language.code);\n      setLanguageEditorOpen(true);\n      setLanguageDraft({", 1)
          s = s.replace("      setEditingLanguage(null);\n      setLanguageDraft({", "      setEditingLanguage(null);\n      setLanguageEditorOpen(true);\n      setLanguageDraft({", 1)
          # close after save
          s = s.replace("      showMessage('Language saved.');\n      openLanguageEditor();", "      showMessage('Language saved.');\n      setLanguageEditorOpen(false);\n      openLanguageEditor();", 1)
          # The language page's editor is the right-most card. Hide its inline placement and render it in a modal via CSS/portal-like fixed positioning.
          p.write_text(s)

          # 9) Organization selected details are visually converted into a modal/page surface by adding a class hook.
          p = root / 'src/pages/OrganizationManagement.tsx'
          s = p.read_text()
          s = s.replace('<div className="vop-card vop-form-card">\n        {!selected?', '<div className={"vop-card vop-form-card vop-org-details-card" + (selected ? " is-open" : "")}>\n        {!selected?', 1)
          p.write_text(s)

          # 10) Admin CSS: modal surfaces, full-width record lists, translation layout, organization details.
          p = root / 'src/pages/admin.css'
          s = p.read_text()
          css = r'''
.vop-admin-record-list-only{display:block!important}
.vop-admin-editor-backdrop,.vop-ann-editor-backdrop{position:fixed;inset:0;z-index:1200;background:rgba(7,27,61,.48);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
.vop-admin-editor-modal,.vop-ann-editor-modal{width:min(760px,96vw);max-height:min(88vh,900px);overflow:hidden;background:#fff;border:1px solid #dbe5f2;border-radius:20px;box-shadow:0 28px 80px rgba(8,31,70,.25);padding:22px}
.vop-admin-editor-scroll{max-height:65vh;overflow:auto;padding:4px 3px 4px 0}
.vop-admin-editor-modal .vop-section-title,.vop-ann-editor-modal .vop-section-title{position:sticky;top:0;background:#fff;z-index:2;padding-bottom:12px;border-bottom:1px solid #edf1f6;margin-bottom:14px}
.vop-icon-button{width:38px;height:38px;border:1px solid #d9e3ef;border-radius:10px;background:#fff;color:#193f78;display:grid;place-items:center;cursor:pointer}
.vop-ann-editor-backdrop{z-index:1210}.vop-ann-editor-modal{overflow:auto;max-height:90vh}
.vop-org-details-card.is-open{position:relative}
.vop-translation-target{grid-column:1 / -1}.vop-translation-entries{grid-column:1 / -1}
@media(max-width:900px){.vop-admin-editor-backdrop,.vop-ann-editor-backdrop{padding:12px}.vop-admin-editor-modal,.vop-ann-editor-modal{width:100%;max-height:94vh;border-radius:16px;padding:16px}.vop-admin-editor-scroll{max-height:72vh}.vop-translation-auto-row{grid-template-columns:1fr!important}.vop-translation-summary{grid-template-columns:repeat(3,1fr)!important}}
'''
          s += '\n' + css
          p.write_text(s)

          print('Admin UI, radio publication normalization and candidate enrollment patch applied.')
          PY


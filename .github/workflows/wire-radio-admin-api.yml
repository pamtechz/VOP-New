name: Wire Radio Admin API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Radio persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminRecordsPanel.tsx')
          s = p.read_text()
          old = "import { getStoredAutoLocalization, saveAutoLocalization } from '../services/storage';"
          new = old + "\nimport { saveRadioAdminRecord, deleteRadioAdminRecord } from '../services/radioAdmin';"
          if "../services/radioAdmin" not in s:
              if old not in s: raise SystemExit('storage import anchor not found')
              s = s.replace(old, new, 1)
          old_save = "await saveAdminRecord(COLLECTIONS[kind], id, payload);"
          new_save = "await (kind === 'radio' ? saveRadioAdminRecord(id, payload) : saveAdminRecord(COLLECTIONS[kind], id, payload));"
          if old_save not in s: raise SystemExit('radio save anchor not found')
          s = s.replace(old_save, new_save, 1)
          old_delete = "await deleteAdminRecord(COLLECTIONS[kind], id);"
          new_delete = "await (kind === 'radio' ? deleteRadioAdminRecord(id) : deleteAdminRecord(COLLECTIONS[kind], id));"
          if old_delete not in s: raise SystemExit('radio delete anchor not found')
          s = s.replace(old_delete, new_delete, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminRecordsPanel.tsx
          git diff --cached --quiet || git commit -m 'fix: wire radio admin save and delete to verified API'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/wire-radio-admin-api.yml
          git commit -m 'chore: remove one-time radio wiring workflow'
          git push

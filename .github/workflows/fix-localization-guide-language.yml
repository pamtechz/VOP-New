name: Repair localization and curriculum language
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch localization and guide language handling
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/i18n.ts')
          s = p.read_text()
          old = "  const locale = getUiLocale();\n  const stored = (() =>"
          new = "  const requestedLocale = normalizeLocale(_legacyLang);\n  const locale = isLocale(requestedLocale) ? requestedLocale : getUiLocale();\n  const stored = (() =>"
          if old not in s:
              raise SystemExit('i18n locale resolver pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/App.tsx')
          s = p.read_text()
          old = "onChangeLanguage={language => { setActiveLang(language); setActiveLanguage(language); setStudyError(''); }}"
          new = "onChangeLanguage={language => { setActiveLang(language); setActiveLanguage(language); setUiLocale(language); setStudyError(''); }}"
          if old not in s:
              raise SystemExit('App language handler pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('api/admin/content.ts')
          s = p.read_text()
          old = "      const lang = String(data.language || '').trim();\n      if (!language(lang)) throw new Error('A valid language code is required for a guide.');"
          new = "      const requestedLanguage = String(data.language || '').trim();\n      let lang = requestedLanguage.toLowerCase();\n      if (!language(lang)) {\n        const languageSnapshot = await ctx.db.collection('languages').get();\n        const normalized = requestedLanguage.toLowerCase();\n        const match = languageSnapshot.docs.find(doc => {\n          const item = doc.data() || {};\n          const candidates = [doc.id, item.code, item.languageCode, item.name, item.nativeName]\n            .map(value => String(value || '').trim().toLowerCase())\n            .filter(Boolean);\n          return candidates.includes(normalized);\n        });\n        lang = match ? String(match.data()?.languageCode || match.data()?.code || match.id || '').trim().toLowerCase() : '';\n      }\n      if (!language(lang)) throw new Error('Select a language from the configured Languages list.');"
          if old not in s:
              raise SystemExit('guide language validation pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/i18n.ts src/App.tsx api/admin/content.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply selected UI locale and resolve curriculum language names"
          git push origin main
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-localization-guide-language.yml
          git commit -m "chore: remove temporary localization repair workflow"
          git push origin main

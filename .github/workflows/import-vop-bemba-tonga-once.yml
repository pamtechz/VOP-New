            @{ Lang='tonga'; File='tonga21.html'; Id='1VJB8RiFyply3U4NZrPkehIKe8MYaH7OH' },
            @{ Lang='tonga'; File='tonga22.html'; Id='1rV8T3lC5Tn0mtAPFT-Y9NL6DPuY32TBD' },
            @{ Lang='tonga'; File='tonga23.html'; Id='11WJyhZDVyJU0GAadYGx-Sax8-ZV0wn35' },
            @{ Lang='tonga'; File='tonga24.html'; Id='1sHhRalWb1hUkv2MQz4pEybtr7azN9rUC' },
            @{ Lang='tonga'; File='tonga25.html'; Id='1vdH6TMoq7F2pOhr7lc4nvpTIHN88hd_s' },
            @{ Lang='tonga'; File='tonga26.html'; Id='1G59S7HQadwRhIOTJFlZ3UTilcGQ2xE0B' }
          )
          if ($sources.Count -ne 52) { throw "Expected exactly 52 approved lesson files, got $($sources.Count)." }
          foreach ($lang in @('bemba','tonga')) {
            New-Item -ItemType Directory -Force -Path "content/source/$lang" | Out-Null
          }
          foreach ($item in $sources) {
            $destination = "content/source/$($item.Lang)/$($item.File)"
            $url = "https://drive.usercontent.google.com/download?id=$($item.Id)&export=download&confirm=t"
            Invoke-WebRequest -Uri $url -OutFile $destination -MaximumRedirection 10
            $bytes = [System.IO.File]::ReadAllBytes($destination)
            if ($bytes.Length -lt 1000) { throw "$destination is unexpectedly small ($($bytes.Length) bytes)." }
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($ascii -notmatch '(?i)<html' -or $ascii -notmatch '(?i)</html>') { throw "$destination is not a complete HTML lesson." }
          }
      - name: Validate exact Bemba and Tonga source inventory
        shell: powershell
        working-directory: vop-approved-lessons-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($lang in @('bemba','tonga')) {
            $files = @(Get-ChildItem "content/source/$lang" -Filter "$lang*.html" -File | Sort-Object Name)
            if ($files.Count -ne 26) { throw "Expected 26 $lang lessons, found $($files.Count)." }
            for ($i = 1; $i -le 26; $i++) {
              $expected = '{0}{1:d2}.html' -f $lang, $i
              if ($files[$i - 1].Name -ne $expected) { throw "Missing or out-of-order $expected." }
            }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit only approved source lessons
        shell: powershell
        working-directory: vop-approved-lessons-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/source/bemba content/source/tonga
          $paths = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($paths.Count -ne 52) { throw "Refusing commit: expected 52 lesson files, staged $($paths.Count)." }
          if (@($paths | Where-Object { $_ -notmatch '^content/source/(bemba|tonga)/(bemba|tonga)[0-9]{2}\.html$' }).Count -ne 0) { throw 'Unexpected staged path; refusing commit.' }
          git commit -m 'Import approved Bemba and Tonga Voice of Prophecy lesson sources'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/fix/reference-design-and-certification-integrity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

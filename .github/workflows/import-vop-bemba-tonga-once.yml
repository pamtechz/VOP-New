name: Import approved Bemba and Tonga lessons once
on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity
    paths:
      - .github/workflows/import-vop-bemba-tonga-once.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-design-and-certification-integrity
          path: vop-approved-lessons-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: true
      - name: Download only the two approved Drive lesson sets
        shell: powershell
        working-directory: vop-approved-lessons-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(
            @{ Lang='bemba'; File='bemba01.html'; Id='1W1D1W_-qA39w4Zptw_OXVLj1_BFJtmCq' },

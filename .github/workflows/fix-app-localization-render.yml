name: Fix app localization render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'pamtechz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch app localization subscription
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="import { initializeLocalization, setUiLocale } from './services/i18n';"
          new="import { initializeLocalization, setUiLocale, useLocalization } from './services/i18n';"
          if old not in s: raise SystemExit('App i18n import not found')
          s=s.replace(old,new,1)
          old2="export const App: React.FC = () => {\n  const [settings, setSettings] = useState<AppSettings>(EMPTY_SETTINGS);"
          new2="export const App: React.FC = () => {\n  const [settings, setSettings] = useState<AppSettings>(EMPTY_SETTINGS);\n  useLocalization(settings);"
          if old2 not in s: raise SystemExit('App component insertion point not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: rerender app when UI locale dictionary loads'
          git push
      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/fix-app-localization-render.yml
          git commit -m 'chore: remove completed localization render repair workflow'
          git push

name: VOP native Android

on:
  pull_request_target:
    paths:
      - 'native_android/**'
      - 'run_web.ps1'
      - '.github/workflows/vop-native-android.yml'
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'native_android/**'
      - 'run_web.ps1'
      - '.github/workflows/vop-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher-parse:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: powershell
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only the KASAINSTITUTE Windows self-hosted runner may execute VOP jobs (got '$env:VOP_ACTUAL_RUNNER')."
          }
      - name: Reject untrusted fork PR before checking out code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          throw "Fork pull requests cannot execute code on the VOP KASAINSTITUTE self-hosted runner. Submit a trusted same-repository PR for verification."
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify PowerShell launcher syntax
        shell: powershell
        run: |
          $parseErrors = $null
          foreach ($scriptPath in @('run_android.ps1', 'run_vop.ps1', 'run_web.ps1', 'native_android/run_android.ps1', 'native_android/run_vop.ps1', 'native_android/run_web.ps1', 'native_android/tool/vercel_web_config.ps1', 'native_android/tool/web_port.ps1', 'native_android/tool/vercel_cli.ps1', 'native_android/tool/flutter_device_parser.ps1', 'native_android/tool/resolve_android_target.ps1', 'native_android/tool/vercel_public_config.ps1', 'tests/nativeDeviceDiscovery.test.ps1', 'tests/nativeVercelClientConfig.test.ps1', 'tests/nativeDynamicDeviceSelection.test.ps1', 'tests/nativeWebConfig.test.ps1', 'tests/nativeFlutterWebPort.test.ps1', 'tests/nativeVercelCliWindows.test.ps1', 'tests/nativeEmulatorLaunchFailure.test.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath).Path,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ("{0}: {1}" -f $scriptPath, $_) }
              exit 1
            }
          }
      - name: Verify Flutter device and emulator parser against Windows CLI output
        shell: powershell
        run: ./tests/nativeDeviceDiscovery.test.ps1
      - name: Verify Vercel public-client filtering cannot expose server settings
        shell: powershell
        run: ./tests/nativeVercelClientConfig.test.ps1
      - name: Verify rotated Android emulator and Wi-Fi device selection
        shell: powershell
        run: ./tests/nativeDynamicDeviceSelection.test.ps1
      - name: Verify browser Firebase public-only settings and HTTPS origin validation
        shell: powershell
        run: ./tests/nativeWebConfig.test.ps1
      - name: Verify occupied Flutter web ports are detected before launch
        shell: powershell
        run: ./tests/nativeFlutterWebPort.test.ps1
      - name: Verify occupied Flutter web ports under Windows PowerShell 5.1
        shell: powershell
        run: .\tests\nativeFlutterWebPort.test.ps1
      - name: Verify Windows Vercel CLI stderr banner is non-fatal while nonzero exits fail
        shell: powershell
        run: ./tests/nativeVercelCliWindows.test.ps1
      - name: Abort promptly and explain Flutter emulator startup code 1
        shell: powershell
        run: ./tests/nativeEmulatorLaunchFailure.test.ps1
  flutter-android:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: powershell
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only the KASAINSTITUTE Windows self-hosted runner may execute VOP jobs (got '$env:VOP_ACTUAL_RUNNER')."
          }
      - name: Reject untrusted fork PR before checking out code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          throw "Fork pull requests cannot execute code on the VOP KASAINSTITUTE self-hosted runner. Submit a trusted same-repository PR for verification."
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use installed Windows Flutter SDK (no WSL)
        shell: powershell
        run: .\.github\scripts\setup-vop-flutter.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate native Gradle scaffold
        run: |
          flutter create --platforms=android --org com.sda --project-name vop native_android
      - name: Install Dart dependencies
        working-directory: native_android
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: native_android
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run native widget tests
        working-directory: native_android
        run: flutter test --no-pub
      - name: Prepare public VOP Firebase Android client config
        working-directory: native_android
        run: python tool/prepare_public_config.py
      - name: Build native Android debug APK
        working-directory: native_android
        shell: cmd
        run: |
          @echo off
          flutter build apk --debug --no-pub --dart-define-from-file=android-public-config.json > android-build.log 2>&1
          set BUILD_RESULT=%ERRORLEVEL%
          type android-build.log
          if not "%BUILD_RESULT%"=="0" exit /b %BUILD_RESULT%
          findstr /C:"WARNING: Your app uses the following plugins that apply Kotlin Gradle Plugin (KGP)" android-build.log >nul
          if not errorlevel 1 (
            echo Flutter plugin still applies legacy Kotlin Gradle Plugin. Upgrade the plugin to one supporting built-in Kotlin.
            exit /b 1
          )
      - uses: actions/upload-artifact@v4
        with:
          name: vop-native-debug-apk
          path: native_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 5

  flutter-web:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 25
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: powershell
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only the KASAINSTITUTE Windows self-hosted runner may execute VOP jobs (got '$env:VOP_ACTUAL_RUNNER')."
          }
      - name: Reject untrusted fork PR before checking out code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          throw "Fork pull requests cannot execute code on the VOP KASAINSTITUTE self-hosted runner. Submit a trusted same-repository PR for verification."
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use installed Windows Flutter SDK (no WSL)
        shell: powershell
        run: .\.github\scripts\setup-vop-flutter.ps1
      - name: Generate and validate Flutter web scaffold
        run: flutter create --platforms=web --org com.sda --project-name vop native_android
      - name: Fetch native Flutter dependencies
        working-directory: native_android
        run: flutter pub get
      - name: Analyze Flutter web source
        working-directory: native_android
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Compile the same Flutter learner app for browser
        working-directory: native_android
        shell: powershell
        run: |
          & flutter build web --release --no-pub --dart-define-from-file=config/web-public.json
          if ($LASTEXITCODE -ne 0) { throw "Flutter web compile failed with exit code $LASTEXITCODE" }
      - name: Verify pinned PasskeyAuthenticator SDK exists in compiled web assets
        shell: powershell
        run: |
          $bundle = 'native_android/build/web/passkeys-bundle.js'
          if (!(Test-Path -LiteralPath $bundle -PathType Leaf)) { throw "Flutter web output is missing the passkeys browser SDK." }
          $index = Get-Content -LiteralPath 'native_android/build/web/index.html' -Raw
          if ($index.IndexOf('passkeys-bundle.js') -lt 0 -or
              $index.IndexOf('passkeys-bundle.js') -gt $index.IndexOf('flutter_bootstrap.js')) {
            throw "Browser passkeys SDK must load before Flutter's generated plugin registrant."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vop-flutter-web-preview
          path: native_android/build/web/
          if-no-files-found: error
          retention-days: 5

name: VOP native Android

on:
  pull_request:
    paths:
      - 'native_android/**'
      - '.github/workflows/vop-native-android.yml'
  push:
    branches: [main]
    paths:
      - 'native_android/**'
      - '.github/workflows/vop-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launcher-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell launcher syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          foreach ($scriptPath in @('run_android.ps1', 'run_vop.ps1', 'native_android/run_android.ps1', 'native_android/run_vop.ps1', 'native_android/tool/flutter_device_parser.ps1', 'native_android/tool/vercel_public_config.ps1', 'tests/nativeDeviceDiscovery.test.ps1', 'tests/nativeVercelClientConfig.test.ps1', 'tests/nativeEmulatorLaunchFailure.test.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath).Path,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ("{0}: {1}" -f $scriptPath, $_) }
              exit 1
            }
          }
      - name: Verify Flutter device and emulator parser against Windows CLI output
        shell: pwsh
        run: ./tests/nativeDeviceDiscovery.test.ps1
      - name: Verify Vercel public-client filtering cannot expose server settings
        shell: pwsh
        run: ./tests/nativeVercelClientConfig.test.ps1
      - name: Abort promptly and explain Flutter emulator startup code 1
        shell: pwsh
        run: ./tests/nativeEmulatorLaunchFailure.test.ps1
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Gradle scaffold
        run: |
          flutter create --platforms=android --org com.sda --project-name vop native_android
      - name: Install Dart dependencies
        working-directory: native_android
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: native_android
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run native widget tests
        working-directory: native_android
        run: flutter test --no-pub
      - name: Prepare public VOP Firebase Android client config
        working-directory: native_android
        run: python3 tool/prepare_public_config.py
      - name: Build native Android debug APK
        working-directory: native_android
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub --dart-define-from-file=android-public-config.json 2>&1 | tee android-build.log
          if grep -Fq 'WARNING: Your app uses the following plugins that apply Kotlin Gradle Plugin (KGP)' android-build.log; then
            echo 'Flutter plugin still applies legacy Kotlin Gradle Plugin. Upgrade the plugin to one supporting built-in Kotlin.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vop-native-debug-apk
          path: native_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 5

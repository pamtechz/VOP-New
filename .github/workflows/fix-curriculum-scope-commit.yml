name: Fix curriculum scope resolution
on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch curriculum request scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/CurriculumManager.tsx')
          s=p.read_text()
          old="""  const adminContent = (action: Parameters<typeof adminContentRequest>[0], collection: string, id?: string, data?: Record<string, unknown>) =>\n    adminContentRequest(action, collection, id, data, scopeOrganizationId);"""
          new="""  const adminContent = (action: Parameters<typeof adminContentRequest>[0], collection: string, id?: string, data?: Record<string, unknown>, organizationOverride?: string) =>\n    adminContentRequest(action, collection, id, data, organizationOverride ?? scopeOrganizationId);"""
          if old not in s: raise SystemExit('adminContent anchor not found')
          s=s.replace(old,new,1)

          old="""    if (isSuperAdmin && !scopeOrganizationId) {\n      const existingGuide = guides.find(item => item.id === editor.guideId && item.language === normalizedLanguage);\n      const source = existingGuide ? guideRecords.find(item => String(item.id || '') === String(existingGuide.id || '')) : undefined;\n      const existingOrganization = valueText(source?.organizationId || source?.ownerOrganizationId);\n      if (existingOrganization) setScopeOrganizationId(existingOrganization);\n    }\n\n    const guide = guides.find(item => item.id === editor.guideId && item.language === normalizedLanguage);"""
          new="""    const existingGuideRecord = guideRecords.find(item => String(item.id || '') === String(editor.guideId));\n    const guideOrganizationId = valueText(existingGuideRecord?.organizationId || existingGuideRecord?.ownerOrganizationId);\n    const targetOrganizationId = scopeOrganizationId || guideOrganizationId;\n    if (isSuperAdmin && guideOrganizationId && guideOrganizationId !== scopeOrganizationId) setScopeOrganizationId(guideOrganizationId);\n\n    const guide = guides.find(item => item.id === editor.guideId && item.language === normalizedLanguage);"""
          if old not in s: raise SystemExit('scope derivation anchor not found')
          s=s.replace(old,new,1)

          old="""      await adminContent('upsertLesson', 'curriculum', id, payload);\n      if (publish) await adminContent('publishLesson', 'curriculum', id, payload);"""
          new="""      await adminContent('upsertLesson', 'curriculum', id, payload, targetOrganizationId);\n      if (publish) await adminContent('publishLesson', 'curriculum', id, payload, targetOrganizationId);"""
          if old not in s: raise SystemExit('lesson request anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CurriculumManager.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve curriculum organization scope before save'
          git push
          git rm .github/workflows/fix-curriculum-scope-commit.yml
          git commit -m 'chore: remove temporary curriculum scope workflow'
          git push

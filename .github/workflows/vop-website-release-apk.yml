name: VOP website signed release APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vop-website-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-website-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 60
    env:
      # Public certificate fingerprint: pins the replacement key for website APKs.
      # This does not claim Google Play activation or change its approval secret.
      VOP_WEBSITE_CERT_SHA256: CF6E27AB39B077954C0715C6A51C27899E3FC4D0F8E8A7B956DD2ABA8F8EDB7F
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: powershell
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only KASAINSTITUTE may execute VOP signing jobs."
          }
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Never release from an unreviewed branch."
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use trusted Windows Flutter SDK
        shell: powershell
        run: .\.github\scripts\setup-vop-flutter.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Android scaffold and restore release signing configuration
        shell: powershell
        run: |
          python native_android/tool/prepare_scaffold.py --platform android
          if ($LASTEXITCODE -ne 0) { throw "Flutter scaffold generation failed." }
          git restore --source=HEAD -- native_android/android/app/build.gradle.kts
          if ($LASTEXITCODE -ne 0) { throw "Could not restore release signing configuration." }

      - name: Install reviewed Flutter dependencies
        working-directory: native_android
        shell: powershell
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Dependency lockfile check failed." }

      - name: Analyze and test Flutter before using a release key
        working-directory: native_android
        shell: powershell
        run: |
          flutter analyze --no-pub --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { throw "Analyzer failed." }
          flutter test --no-pub --concurrency=1
          if ($LASTEXITCODE -ne 0) { throw "Widget tests failed." }

      - name: Prepare public Firebase settings
        working-directory: native_android
        shell: powershell
        run: |
          python tool/prepare_public_config.py
          if ($LASTEXITCODE -ne 0) { throw "Firebase client configuration is invalid." }

      - name: Prepare ephemeral upload keystore and validate fingerprint
        shell: powershell
        env:
          VOP_RELEASE_KEYSTORE_BASE64: ${{ secrets.VOP_RELEASE_KEYSTORE_BASE64 }}
          VOP_RELEASE_KEY_ALIAS: ${{ secrets.VOP_RELEASE_KEY_ALIAS }}
          VOP_RELEASE_STORE_PASSWORD: ${{ secrets.VOP_RELEASE_STORE_PASSWORD }}
          VOP_RELEASE_KEY_PASSWORD: ${{ secrets.VOP_RELEASE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('VOP_RELEASE_KEYSTORE_BASE64', 'VOP_RELEASE_KEY_ALIAS',
            'VOP_RELEASE_STORE_PASSWORD', 'VOP_RELEASE_KEY_PASSWORD',
            'VOP_WEBSITE_CERT_SHA256')
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing secret: $name. No release bundle was produced."
            }
          }
          $root = Join-Path $env:GITHUB_WORKSPACE 'native_android\android'
          $keystore = Join-Path $root 'vop-upload-key.jks'
          $properties = Join-Path $root 'key.properties'
          $certificate = Join-Path $root 'upload-certificate.der'
          $expected = ($env:VOP_WEBSITE_CERT_SHA256 -replace '[^a-fA-F0-9]', '').ToUpperInvariant()
          if ($expected -notmatch '^[A-F0-9]{64}$') {
            throw 'The pinned website certificate SHA-256 must contain 64 hex digits.'
          }
          function Escape-Property([string]$v) {
            if ($v -match '[^\x20-\x7E]' -or $v -ne $v.Trim()) {
              throw 'Signing values must be printable ASCII without outer whitespace.'
            }
            return $v.Replace('\', '\\').Replace('=', '\=').Replace(':', '\:').Replace('#', '\#').Replace('!', '\!')
          }
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:VOP_RELEASE_KEYSTORE_BASE64))
          [IO.File]::WriteAllLines($properties, @(
            'storeFile=vop-upload-key.jks',
            ('storePassword=' + (Escape-Property $env:VOP_RELEASE_STORE_PASSWORD)),
            ('keyAlias=' + (Escape-Property $env:VOP_RELEASE_KEY_ALIAS)),
            ('keyPassword=' + (Escape-Property $env:VOP_RELEASE_KEY_PASSWORD))
          ), [Text.UTF8Encoding]::new($false))
          & keytool -exportcert -keystore $keystore -alias $env:VOP_RELEASE_KEY_ALIAS -storepass:env VOP_RELEASE_STORE_PASSWORD -file $certificate
          if ($LASTEXITCODE -ne 0) { throw 'Upload keystore or alias is invalid.' }
          $actual = (Get-FileHash $certificate -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw 'Website keystore certificate does not match its pinned public certificate.'
          }
          Write-Host 'Upload keystore certificate fingerprint verified.'

      - name: Build and verify obfuscated release APK
        working-directory: native_android
        shell: powershell
        env:
          VOP_RELEASE_SYMBOLS_DIR: ${{ secrets.VOP_RELEASE_SYMBOLS_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VOP_RELEASE_SYMBOLS_DIR)) {
            throw 'A private VOP_RELEASE_SYMBOLS_DIR backup path is required before Dart obfuscation.'
          }
          $backupRoot = [Environment]::ExpandEnvironmentVariables($env:VOP_RELEASE_SYMBOLS_DIR)
          if ($backupRoot -match '%[^%]+%' -or ![IO.Path]::IsPathRooted($backupRoot)) {
            throw 'The private symbols backup must resolve to an absolute Windows path.'
          }
          $env:ORG_GRADLE_PROJECT_vopCompressNativeLibraries = 'true'
          $symbols = 'build/app/outputs/vop-obfuscation/apk'
          flutter build apk --release --no-pub --obfuscate --split-debug-info=$symbols --split-per-abi --tree-shake-icons --dart-define-from-file=android-public-config.json
          if ($LASTEXITCODE -ne 0) { throw 'Obfuscated release APK build failed.' }
          $sizeResults = @()
          $apkVersions = @{ 'armeabi-v7a' = 1003; 'arm64-v8a' = 2003; 'x86_64' = 4003 }
          foreach ($abi in @('armeabi-v7a', 'arm64-v8a', 'x86_64')) {
          $apk = "build/app/outputs/flutter-apk/app-$abi-release.apk"
          if (!(Test-Path -LiteralPath $apk -PathType Leaf)) { throw 'Missing release APK.' }
          $apkBytes = (Get-Item -LiteralPath $apk).Length
          Write-Host ("Release APK size: {0} bytes; requested limit: 8,000,000 bytes." -f $apkBytes)
          $sizeResults += [PSCustomObject]@{abi=$abi; bytes=$apkBytes; withinBudget=($apkBytes -le 8000000)}
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_SDK_ROOT }
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'Set ANDROID_HOME or ANDROID_SDK_ROOT on KASAINSTITUTE.' }
          $tools = @(Get-ChildItem -LiteralPath (Join-Path $sdk 'build-tools') -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending)
          if ($tools.Count -eq 0) { throw 'Android SDK build-tools are missing.' }
          $apksigner = Join-Path $tools[0].FullName 'apksigner.bat'
          if (!(Test-Path -LiteralPath $apksigner -PathType Leaf)) { throw 'Android apksigner is missing.' }
          $signature = @(& $apksigner verify --verbose --print-certs $apk 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
          $signers = @($signature | Select-String -Pattern '^Signer #\d+ certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)\s*$')
          $expected = ($env:VOP_WEBSITE_CERT_SHA256 -replace '[^A-Fa-f0-9]', '').ToUpperInvariant()
          if ($signers.Count -ne 1 -or $expected -notmatch '^[A-F0-9]{64}$') {
            throw 'APK must contain exactly one verifiable website signing certificate.'
          }
          $actual = ($signers[0].Matches[0].Groups[1].Value -replace '[^A-Fa-f0-9]', '').ToUpperInvariant()
          if ($actual -ne $expected) { throw 'APK signer differs from the pinned website certificate.' }
          $aapt = Join-Path $tools[0].FullName 'aapt.exe'
          if (!(Test-Path -LiteralPath $aapt -PathType Leaf)) { throw 'Android aapt is missing.' }
          $badging = @(& $aapt dump badging $apk 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release APK metadata.' }
          if (!($badging | Select-String -Pattern "^package: name='com\.sda\.vop' versionCode='$($apkVersions[$abi])' versionName='2\.2\.0'(?: |$)")) {
            throw 'APK package or version differs from the reviewed com.sda.vop 2.2.0 (3) release.'
          }
          if ($badging -notcontains "targetSdkVersion:'36'") { throw 'APK must target API 36.' }
          }
          # Separate maps for each build: never overwrite AAB crash symbols.
          $directory = Join-Path (Join-Path $backupRoot $env:GITHUB_SHA) 'apk'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $maps = @(Get-ChildItem -Path $symbols -File -Filter 'app.*.symbols' -ErrorAction SilentlyContinue)
          if ($maps.Count -eq 0) { throw 'APK obfuscation symbol maps were not generated.' }
          foreach ($map in $maps) { Copy-Item -LiteralPath $map.FullName -Destination $directory -Force }
          $mapping = 'build/app/outputs/mapping/release/mapping.txt'
          if (!(Test-Path -LiteralPath $mapping -PathType Leaf)) { throw 'APK R8 mapping file was not generated.' }
          Copy-Item -LiteralPath $mapping -Destination (Join-Path $directory 'mapping.txt') -Force
          $sizeResults | Export-Csv -LiteralPath 'build/app/outputs/website-apk-sizes.csv' -NoTypeInformation
          python tool/apk_size_report.py build/app/outputs/flutter-apk
          if ($LASTEXITCODE -ne 0) { throw 'APK size inspection failed.' }
          Write-Host 'Website APK signatures verified; private Dart and R8 maps backed up.'
          if (@($sizeResults | Where-Object { !$_.withinBudget }).Count -gt 0) {
            throw 'Website APK exceeds 8,000,000 bytes. See the measured size report; oversized APKs will not be distributed.'
          }

      - name: Record verified release artifact checksums
        working-directory: native_android
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk',
            'build/app/outputs/flutter-apk/app-arm64-v8a-release.apk',
            'build/app/outputs/flutter-apk/app-x86_64-release.apk')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            '{0}  {1}' -f $hash, [IO.Path]::GetFileName($path)
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'build/app/outputs/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))

      - name: Upload verified release APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: vop-website-signed-release-apks
          path: |
            native_android/build/app/outputs/flutter-apk/app-*-release.apk
            native_android/build/app/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload size diagnostics even when the budget fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vop-website-apk-size-report
          path: |
            native_android/build/app/outputs/website-apk-sizes.csv
            native_android/build/app/outputs/flutter-apk/apk-size-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete temporary release keystore from self-hosted runner
        if: always()
        shell: powershell
        run: |
          foreach ($path in @(
            'native_android\android\vop-upload-key.jks',
            'native_android\android\key.properties',
            'native_android\android\upload-certificate.der'
          )) {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }
          foreach ($directory in @(
            'native_android\build\app\outputs\vop-obfuscation',
            'native_android\build\app\outputs\mapping\release'
          )) {
            Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'Temporary signing files removed.'

name: Verify VOP changes
on:
  push:
    branches:
      - main
      - 'prod/**'
  pull_request_target:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: vop-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 65
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: powershell
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only the KASAINSTITUTE Windows self-hosted runner may execute VOP jobs (got '$env:VOP_ACTUAL_RUNNER')."
          }
      - name: Reject untrusted fork PR before checking out code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          throw "Fork pull requests cannot execute code on the VOP KASAINSTITUTE self-hosted runner. Submit a trusted same-repository PR for verification."
      # Never reuse a checkout potentially owned by a different runner account.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        timeout-minutes: 30
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        shell: powershell
        run: |
          # Multiple self-hosted runner services share Windows disk and npm
          # cache. Serialize only package installation, not the test suites.
          $lock = New-Object System.Threading.Mutex($false, 'Global\VOP-NPM-CI-WINDOWS')
          $acquired = $false
          try {
            try {
              $acquired = $lock.WaitOne([TimeSpan]::FromMinutes(18))
            } catch [System.Threading.AbandonedMutexException] {
              $acquired = $true
            }
            if (-not $acquired) { throw 'Timed out waiting for the shared npm install lock.' }
            & npm ci --no-audit --no-fund --prefer-offline --loglevel=warn --maxsockets=8
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }
          } finally {
            if ($acquired) { $lock.ReleaseMutex() }
            $lock.Dispose()
          }
      - name: Regenerate and verify source-derived offline lessons
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:content
      - name: Typecheck and build
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build
      - name: Enforce production bundle budget
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:bundle-budget
      - name: Enforce UI localization budget
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:ui-localization
      - name: Lint
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run lint
      - name: Unit and architecture regression tests
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:unit
      - name: Reject moderate or worse production dependency vulnerabilities
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report exact development-tool advisory chains
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/report-dev-advisories.mjs

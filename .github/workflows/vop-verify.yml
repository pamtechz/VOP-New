name: Verify VOP changes
on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity
  workflow_dispatch:
concurrency:
  group: vop-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 20
    steps:
      # Never reuse a checkout potentially owned by a different runner account.
      - uses: actions/checkout@v4
        with:
          path: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm ci
      - name: Regenerate and verify source-derived offline lessons
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:content
      - name: Typecheck and build
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build
      - name: Lint
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run lint
      - name: Regression tests
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: node --experimental-strip-types --test tests/offlineManifest.test.ts tests/progress.test.ts tests/multitest.test.ts tests/certificatePreview.test.ts tests/averageScore.test.ts tests/quiz.test.ts tests/lesson.test.ts tests/studyTransactions.test.ts tests/androidRelease.test.mjs tests/productionAssets.test.mjs
      - name: Reject moderate or worse production dependency vulnerabilities
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report exact development-tool advisory chains
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/report-dev-advisories.mjs

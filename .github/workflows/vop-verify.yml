name: Verify VOP changes
on:
  push:
    branches:
      - main
      - 'prod/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: vop-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Never reuse a checkout potentially owned by a different runner account.
      - uses: actions/checkout@v4
        with:
          path: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm ci
      - name: Regenerate and verify source-derived offline lessons
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:content
      - name: Typecheck and build
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build
      - name: Enforce production bundle budget
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:bundle-budget
      - name: Enforce UI localization budget
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify:ui-localization
      - name: Lint
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run lint
      - name: Unit and architecture regression tests
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:unit
      - name: Reject moderate or worse production dependency vulnerabilities
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report exact development-tool advisory chains
        working-directory: vop-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/report-dev-advisories.mjs

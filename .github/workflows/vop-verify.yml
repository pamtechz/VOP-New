name: Verify VOP changes
on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --experimental-strip-types --test tests/progress.test.ts

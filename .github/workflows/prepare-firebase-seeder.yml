name: Prepare Firebase lesson seeder
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: [self-hosted, KASAINSTITUTE]
    steps:
      - uses: actions/checkout@v4
        with:
          path: vop-seed-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install firebase-admin
        shell: powershell
        working-directory: vop-seed-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm install --save-dev --save-exact firebase-admin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit dependency manifest
        shell: powershell
        working-directory: vop-seed-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "firebase-admin is already locked."
            exit 0
          }
          git commit -m "Add Firebase Admin SDK for lesson seeding"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Safely repair VOP development dependencies once
on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity
    paths:
      - .github/workflows/vop-safe-dev-dependency-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-design-and-certification-integrity
          path: vop-advisory-repair-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply only vendor-aligned transitive overrides to isolated checkout
        shell: powershell
        working-directory: vop-advisory-repair-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          @'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if (data.devDependencies['firebase-tools'] !== '15.30.2') throw new Error('Unexpected CLI version. Refusing blind repair.');
          data.overrides = { ...data.overrides, '@opentelemetry/core': '2.8.0', gaxios: { uuid: '11.1.1' } };
          writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          '@ | Set-Content -Path .vop-test-overrides.mjs -Encoding UTF8
          node .vop-test-overrides.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove advisory reduction without ignoring failures
        shell: powershell
        working-directory: vop-advisory-repair-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/report-dev-advisories.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $raw = npm audit --json
          $report = $raw | ConvertFrom-Json
          if (-not $report -or -not $report.metadata -or -not $report.metadata.vulnerabilities) { throw 'Cannot parse full audit metadata.' }
          $count = [int]$report.metadata.vulnerabilities.moderate + [int]$report.metadata.vulnerabilities.high + [int]$report.metadata.vulnerabilities.critical
          if ($count -ge 7) { throw "Patch did not reduce advisories (remaining: $count)." }
          npm audit --omit=dev --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate complete app and Firebase CLI emulator before any push
        shell: powershell
        working-directory: vop-advisory-repair-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test tests/offlineManifest.test.ts tests/progress.test.ts tests/multitest.test.ts tests/certificatePreview.test.ts tests/averageScore.test.ts tests/quiz.test.ts tests/lesson.test.ts tests/studyTransactions.test.ts tests/snapshots.test.mjs tests/androidRelease.test.mjs tests/productionAssets.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install firebase --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install firebase emulators:exec --project demo-vop-security-rules --only firestore "node --test tests/firestoreRules.test.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit only validated dependency manifests
        shell: powershell
        working-directory: vop-advisory-repair-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          $paths = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($paths.Count -ne 2 -or $paths -notcontains 'package.json' -or $paths -notcontains 'package-lock.json') { throw 'Unexpected staged file set; refusing push.' }
          git commit -m 'Mitigate vendor-aligned Firebase CLI transitive advisories'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/fix/reference-design-and-certification-integrity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

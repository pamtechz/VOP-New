name: VOP validation

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main

concurrency:
  group: vop-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 50
    steps:
      - name: Verify KASAINSTITUTE runner identity
        shell: powershell
        env:
          VOP_ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          if ($env:VOP_ACTUAL_RUNNER -ne 'KASAINSTITUTE') {
            throw "Only the KASAINSTITUTE Windows self-hosted runner may execute VOP jobs (got '$env:VOP_ACTUAL_RUNNER')."
          }
      - name: Reject untrusted fork PR before checking out code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          throw "Fork pull requests cannot execute code on the VOP KASAINSTITUTE self-hosted runner. Submit a trusted same-repository PR for verification."
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from the lockfile (bounded)
        timeout-minutes: 12
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=info
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run verify:bundle-budget
      - run: npm run typecheck:serverless
      - run: npm run lint
      - run: npm run verify:architecture
      - run: npm run verify:ui-localization
      - run: npm run verify:content
      - run: npm run test:unit
      - run: npm run test:contracts --if-present
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run verify:rules
      - run: npx --no-install firebase emulators:exec --project demo-vop-security-rules --only firestore,auth "node --test tests/institutionAdmissionApi.integration.mjs"
      - run: npx --no-install firebase emulators:exec --project demo-vop-security-rules --only firestore,auth "node --test --test-concurrency=1 tests/engagementApi.integration.mjs tests/quizApi.integration.mjs tests/graduationApi.integration.mjs tests/studyProgressApi.integration.mjs tests/shareApi.integration.mjs tests/tenantLanguageApi.integration.mjs tests/programsApi.integration.mjs tests/shareEnrollmentApi.integration.mjs tests/plateMigration.integration.mjs tests/mentorshipApi.integration.mjs tests/paymentsApi.integration.mjs tests/notificationsApi.integration.mjs tests/ownProfile.integration.mjs tests/registrationApi.integration.mjs tests/accountLifecycleApi.integration.mjs tests/operationsApi.integration.mjs tests/passkeysApi.integration.mjs"

name: VOP validation

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run lint
      - run: npm run verify:architecture
      - run: npm run inventory:ui-localization
      - run: npm run verify:content
      - run: npm run test:unit
      - run: npm run test:contracts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run verify:rules

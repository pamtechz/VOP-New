name: Production CI

on:
  push:
    branches: [main, 'refactor/**', 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Admin Portal (Next.js 14 + TypeScript) ──────────────────────────
  admin-ci:
    name: Admin Portal Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://yyscxqqiilpifogbktia.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy_anon_key_for_ci_build' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy_service_key_for_ci_build' }}
        run: npm run build

  # ── Job 2: Mobile App (Flutter / Android) ──────────────────────────────────
  mobile-ci:
    name: Mobile App & Android Platform Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android APK (Release Verification)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://yyscxqqiilpifogbktia.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key' }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=RESOURCE_MODE=constrained

  # ── Job 3: Database & Migrations Verification ──────────────────────────────
  database-ci:
    name: Supabase Migrations & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SQL Syntax of Migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking migration: $f"
            # Basic validation to ensure statements are properly terminated
            test -s "$f" || exit 1
          done
          echo "All migration files present and non-empty."

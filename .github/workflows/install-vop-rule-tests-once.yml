name: Lock VOP Firebase rule test tooling once
on:
  push:
    branches: [fix/reference-design-and-certification-integrity]
    paths: [.github/workflows/install-vop-rule-tests-once.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-design-and-certification-integrity
          persist-credentials: true
          path: vop-rule-lock-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update dependency manifests only
        shell: powershell
        working-directory: vop-rule-lock-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pkg get devDependencies."@firebase/rules-unit-testing" devDependencies.firebase-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit only dependency manifests
        shell: powershell
        working-directory: vop-rule-lock-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          $changed = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($changed.Count -eq 0) { Write-Output 'Locked Firebase rule tooling already present.'; exit 0 }
          if (($changed | Where-Object { $_ -notin @('package.json', 'package-lock.json') }).Count -gt 0) {
            Write-Error 'Refusing to commit files outside dependency manifests.'
            exit 1
          }
          git commit -m 'Lock Firebase security rule test tooling'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/fix/reference-design-and-certification-integrity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Credential Leak Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  credential-guard:
    runs-on: [self-hosted, KASAINSTITUTE]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject service-account private keys
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE '"private_key"\s*:\s*"-----BEGIN (RSA )?PRIVATE KEY-----' -- ':!*.lock' ':!docs/**'; then
            echo "::error::A Google Cloud service-account private key was found in tracked source."
            exit 1
          fi

          if git grep -nE 'private_key_id|client_email.*iam\.gserviceaccount\.com' -- ':!*.lock' ':!docs/**' | grep -E '(^|:)\s*.*(private_key_id|iam\.gserviceaccount\.com)' >/dev/null; then
            echo "::error::A service-account credential pattern was found in tracked source."
            exit 1
          fi

      - name: Verify Android Firebase config contains no private credential
        shell: bash
        run: |
          set -euo pipefail
          file="android/app/google-services.json"
          if [ -f "$file" ] && grep -q '"private_key"' "$file"; then
            echo "::error::$file contains a private service-account credential."
            exit 1
          fi

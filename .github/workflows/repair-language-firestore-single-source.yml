name: Repair language and translation Firestore flow
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical language and translation flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('api/admin/content.ts')
          s=p.read_text()
          marker="""      if (GLOBAL_COLLECTIONS.has(collection)) {\n        if (ctx.isSuperAdmin) {\n          const snap = await ctx.db.collection(collection).get();\n          if (collection === 'translations') {"""
          replacement="""      if (GLOBAL_COLLECTIONS.has(collection)) {\n        if (collection === 'translations') {\n          const languageSnap = await ctx.db.collection('languages').get();\n          const languageDocs = languageSnap.docs.filter(d => d.data()?.enabled !== false);\n          const items = await Promise.all(languageDocs.map(async languageDoc => {\n            const language = languageDoc.data() || {};\n            const code = String(language.code || language.languageCode || languageDoc.id).trim().toLowerCase();\n            const localeSnap = await ctx.db.doc(`locales/${code}`).get();\n            const values: Record<string,string> = {};\n            const translationSnap = await ctx.db.collection(`locales/${code}/translations`).get();\n            translationSnap.docs.forEach(doc => { const value = String(doc.data()?.value ?? ''); if (value.trim()) values[doc.id] = value; });\n            const legacySnap = await ctx.db.doc(`translations/${code}`).get();\n            const legacyValues = legacySnap.data()?.values;\n            if (legacyValues && typeof legacyValues === 'object') Object.entries(legacyValues as Record<string,unknown>).forEach(([key,value]) => { if (!values[key] && typeof value === 'string' && value.trim()) values[key] = value; });\n            return { id: code, code, languageCode: code, name: String(language.name || language.nativeName || code), nativeName: String(language.nativeName || language.name || code), values, enabled: language.enabled !== false, canEdit: ctx.isSuperAdmin, localeExists: localeSnap.exists };\n          }));\n          return res.status(200).json({ ok:true, items });\n        }\n        if (ctx.isSuperAdmin) {\n          const snap = await ctx.db.collection(collection).get();\n          if (collection === 'translations') {"""
          if marker not in s: raise SystemExit('translation list marker not found')
          s=s.replace(marker,replacement,1)
          marker="""      if (action === 'upsert') {\n        const incoming = body.data && typeof body.data === 'object' ? body.data as Record<string, unknown> : {};\n        if (existing.exists) await requirePermission(ctx, resourceForCollection(collection) || 'curriculum', 'update');"""
          replacement="""      if (action === 'upsert') {\n        const incoming = body.data && typeof body.data === 'object' ? body.data as Record<string, unknown> : {};\n        if (collection === 'translations') {\n          if (!ctx.isSuperAdmin) throw new Error('Only the VOP Super Admin can manage global UI translations.');\n          const requestedCode = String(incoming.code || incoming.languageCode || id).trim().toLowerCase();\n          const languageSnap = await ctx.db.collection('languages').get();\n          const languageDoc = languageSnap.docs.find(d => { const data = d.data() || {}; return [d.id, data.code, data.languageCode, data.name, data.nativeName].map(v => String(v || '').trim().toLowerCase()).includes(requestedCode); });\n          if (!languageDoc) throw new Error('Select a language from the configured Languages list.');\n          const language = languageDoc.data() || {};\n          const code = String(language.code || language.languageCode || languageDoc.id).trim().toLowerCase();\n          const values = incoming.values && typeof incoming.values === 'object' ? incoming.values as Record<string,unknown> : {};\n          await ctx.db.doc(`locales/${code}`).set({ id:code, code, name:String(language.name || language.nativeName || code), nativeName:String(language.nativeName || language.name || code), enabled:language.enabled !== false, direction:language.rtl === true ? 'rtl' : 'ltr', fallback:String(language.fallback || 'en'), updatedAt:FieldValue.serverTimestamp(), updatedBy:ctx.auth.uid }, {merge:true});\n          const batch = ctx.db.batch();\n          Object.entries(values).forEach(([key,value]) => { const translationValue = String(value ?? ''); batch.set(ctx.db.doc(`locales/${code}/translations/${safeId(key)}`), { key, locale:code, namespace:key.split('.')[0], value:translationValue, status:translationValue.trim() ? 'published' : 'draft', source:'', version:FieldValue.increment(1), updatedAt:FieldValue.serverTimestamp(), updatedBy:ctx.auth.uid }, {merge:true}); });\n          await batch.commit();\n          await ctx.db.doc(`translations/${code}`).set({id:code, languageCode:code, code, name:String(language.name || code), nativeName:String(language.nativeName || language.name || code), values, enabled:language.enabled !== false, updatedAt:FieldValue.serverTimestamp(), updatedBy:ctx.auth.uid}, {merge:true});\n          return res.status(200).json({ok:true,item:{id:code,code,languageCode:code,name:String(language.name || code),nativeName:String(language.nativeName || language.name || code),values}});\n        }\n        if (existing.exists) await requirePermission(ctx, resourceForCollection(collection) || 'curriculum', 'update');"""
          if marker not in s: raise SystemExit('translation upsert marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          p=Path('src/components/admin/ContentStudio.tsx')
          s=p.read_text()
          old="""        id = text(draft.id).trim().toLowerCase();\n        if (!id) throw new Error('Translation language code is required.');"""
          new="""        const requestedLanguage = text(draft.id).trim();\n        const selectedLanguage = languages.find(language => [language.code, language.name, language.nativeName].map(value => text(value).trim().toLowerCase()).includes(requestedLanguage.toLowerCase()));\n        id = text(selectedLanguage?.code || requestedLanguage).trim().toLowerCase();\n        if (!selectedLanguage) throw new Error('Select a language from the configured Languages list.');"""
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('src/pages/CurriculumManager.tsx')
          s=p.read_text()
          old="""    const source = row.raw || {};\n    const organizationId = valueText(source.organizationId || source.ownerOrganizationId);"""
          new="""    const source: RecordItem = row.raw || { id: row.key };\n    const organizationId = valueText(source.organizationId || source.ownerOrganizationId);"""
          if old not in s: raise SystemExit('openLesson typing marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install and build
        run: npm ci && npm run build
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/admin/content.ts src/components/admin/ContentStudio.tsx src/pages/CurriculumManager.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify language and translation Firestore storage"
          git push
      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-language-firestore-single-source.yml || true
          git commit -m "chore: remove one-time language firestore repair workflow" || true
          git push || true

name: Repair Admin Records UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore known-good modal migration
        run: |
          git fetch origin c6eb2cdfef4b6414db782b46335a4b9092f11b14 --depth=1
          git checkout c6eb2cdfef4b6414db782b46335a4b9092f11b14 -- src/pages/AdminRecordsPanel.tsx

      - name: Repair shared editor state and remove legacy column spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/AdminRecordsPanel.tsx')
          s = p.read_text()
          marker = "  const [saving, setSaving] = useState(false);\n"
          state = "  const [editorOpen, setEditorOpen] = useState(false);\n"
          before_load_error, after_load_error = s.split("  const loadError", 1)
          if state not in before_load_error:
              if marker not in before_load_error:
                  raise SystemExit('AdminRecordsPanel shared state marker not found')
              before_load_error = before_load_error.replace(marker, marker + state, 1)
              s = before_load_error + "  const loadError" + after_load_error
          p.write_text(s)

          p = Path('src/pages/admin.css')
          s = p.read_text()
          old = ".vop-admin-record-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,.75fr);gap:18px;align-items:start}"
          s = s.replace(old, ".vop-admin-record-layout{display:block;min-width:0}", 1)
          marker_css = ".vop-admin-record-list-only{display:block!important;grid-template-columns:1fr!important;min-width:0}"
          if marker_css not in s:
              s += "\n" + marker_css + "\n"
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminRecordsPanel.tsx src/pages/admin.css
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
          else
            git commit -m 'fix: restore admin records modal editor state'
            git push origin main
          fi

      - name: Validate repair
        run: |
          npm ci
          npm run build

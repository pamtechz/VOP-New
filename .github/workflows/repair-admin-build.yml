name: Repair Admin Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair admin build state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair AdminRecordsPanel state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminRecordsPanel.tsx')
          s = p.read_text()
          marker = "  const [saving, setSaving] = useState(false);"
          state = "  const [editorOpen, setEditorOpen] = useState(false);"
          if state not in s:
              if marker not in s:
                  raise SystemExit('AdminRecordsPanel saving state marker not found')
              s = s.replace(marker, marker + "\n" + state, 1)
              p.write_text(s)
          print('AdminRecordsPanel editor state verified.')
          PY

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-admin-build.yml
          git add src/pages/AdminRecordsPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair admin build state"
          git push origin HEAD:main

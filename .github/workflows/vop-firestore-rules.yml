name: Verify VOP Firestore rules
on:
  push:
    branches:
      - fix/reference-design-and-certification-integrity
    paths:
      - firestore.rules
      - firebase.json
      - tests/firestoreRules.test.mjs
      - .github/workflows/vop-firestore-rules.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: vop-rules-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked application dependencies
        working-directory: vop-rules-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm ci
      - name: Install exact emulator tooling without changing manifests
        shell: powershell
        working-directory: vop-rules-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { Write-Error 'Security test tooling must not modify dependency manifests.'; exit 1 }
      - name: Run owner-isolation rules tests against local emulator only
        shell: powershell
        working-directory: vop-rules-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          java -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx firebase emulators:exec --project demo-vop-security-rules --only firestore "node --test tests/firestoreRules.test.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Verify Radio Delete Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-radio-delete.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch global delete verification
        shell: python
        run: |
          from pathlib import Path
          p=Path('api/admin/content.ts')
          s=p.read_text()
          old="""      if (action === 'delete') {\n        if (!existing.exists || !canEditCanonicalContent(ctx, existing.data())) throw new Error('Only the contributor who added this global content or VOP Super Admin can delete it.');\n        await ref.delete();\n        return res.status(200).json({ ok:true, id });\n      }"""
          new="""      if (action === 'delete') {\n        if (!existing.exists || !canEditCanonicalContent(ctx, existing.data())) throw new Error('Only the contributor who added this global content or VOP Super Admin can delete it.');\n        await ref.delete();\n        const deleted = await ref.get();\n        if (deleted.exists) throw new Error('The record could not be deleted from Firestore.');\n        return res.status(200).json({ ok:true, id, deleted:true });\n      }"""
          if old not in s: raise SystemExit('Global delete block not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/admin/content.ts
          git commit -m "fix: verify global content deletion" || exit 0
          git push origin main
      - name: Remove workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/verify-radio-delete.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then git commit -m "chore: remove one-time delete verification workflow"; git push origin main; fi

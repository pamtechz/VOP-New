apply plugin: 'com.android.application'

def versionCodeSource = System.getenv("VOP_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER")
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (versionCodeSource && !(versionCodeSource ==~ /[1-9][0-9]*/)) {
    throw new GradleException("VOP_VERSION_CODE/GITHUB_RUN_NUMBER must be a positive integer.")
}
if (releaseRequested && !versionCodeSource) {
    throw new GradleException("Release version is not configured. Set VOP_VERSION_CODE or run in GitHub Actions with GITHUB_RUN_NUMBER.")
}
def resolvedVersionCode = versionCodeSource ? Integer.parseInt(versionCodeSource) : 1
def resolvedVersionName = System.getenv("VOP_VERSION_NAME") ?: "0.0.${resolvedVersionCode}"

android {
    namespace = "com.sda.vop"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sda.vop"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is environment-driven. Never commit keystore credentials.
    signingConfigs {
        release {
            def storeFilePath = System.getenv("VOP_RELEASE_STORE_FILE")
            def storePasswordValue = System.getenv("VOP_RELEASE_STORE_PASSWORD")
            def keyAliasValue = System.getenv("VOP_RELEASE_KEY_ALIAS")
            def keyPasswordValue = System.getenv("VOP_RELEASE_KEY_PASSWORD")

            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("VOP_RELEASE_STORE_FILE") &&
                    System.getenv("VOP_RELEASE_STORE_PASSWORD") &&
                    System.getenv("VOP_RELEASE_KEY_ALIAS") &&
                    System.getenv("VOP_RELEASE_KEY_PASSWORD")) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("Release signing is not configured. Set VOP_RELEASE_STORE_FILE, VOP_RELEASE_STORE_PASSWORD, VOP_RELEASE_KEY_ALIAS, and VOP_RELEASE_KEY_PASSWORD before assembling a release build.")
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

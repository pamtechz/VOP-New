name: vop
description: Native Voice of Prophecy Android learner application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  google_sign_in: ^6.3.0
  http: ^1.4.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.3
  share_plus: ^13.3.1
  local_auth: ^2.3.0
  passkeys: ^2.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

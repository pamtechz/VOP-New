name: vop
description: Native Voice of Prophecy Android learner application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  http: ^1.4.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  share_plus: ^13.3.1
  local_auth: ^3.0.2
  passkeys: ^2.23.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

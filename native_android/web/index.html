<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a33">
  <meta name="description" content="Voice of Prophecy — Bible study and mentoring">
  <meta name="application-name" content="Voice of Prophecy">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <script>
    // A protected Vercel preview may redirect manifest.json to SSO. Manifest
    // fetches omit auth cookies by default, so probe with credentials before
    // adding the installability link. Do not follow an SSO redirect.
    (function () {
      function addManifest() {
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = 'manifest.json';
        link.crossOrigin = 'use-credentials';
        document.head.appendChild(link);
      }
      if (!location.hostname.endsWith('.vercel.app')) {
        addManifest();
        return;
      }
      fetch(new URL('manifest.json', document.baseURI), {
        credentials: 'include', redirect: 'manual', cache: 'no-store'
      }).then(function (response) {
        if (response.type === 'basic' && response.ok &&
            /(?:application\/json|application\/manifest\+json)/i.test(
              response.headers.get('content-type') || '')) {
          addManifest();
        }
      }).catch(function () {
        // No PWA manifest in an unauthenticated/offline preview.
      });
    })();
  </script>
  <title>Voice of Prophecy</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071a33}body{overflow:hidden}
    #vop-startup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font:500 15px system-ui,sans-serif;color:#e0ebf6;background:#071a33;z-index:0}
    #vop-startup .intro{text-align:center;max-width:320px;padding:28px}
    #vop-startup .emblem{display:inline-flex;align-items:center;justify-content:center;
      width:70px;height:70px;border:2px solid #f6c76c;border-radius:24px;
      font-size:39px;color:#f6c76c;margin-bottom:18px}
    #vop-startup strong{display:block;color:#fff;font-size:23px;letter-spacing:-.03em}
    #vop-startup p{line-height:1.5}
    #vop-startup .pulse{width:26px;height:26px;margin:20px auto;border:3px solid #375b77;
      border-top-color:#f6c76c;border-radius:50%;animation:vop-spin .8s linear infinite}
    flutter-view{position:relative;z-index:1}
    @keyframes vop-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#vop-startup .pulse{animation:none}}
  </style>
  <script>
    window.PasskeyAuthenticator = window.PasskeyAuthenticator || {
      init: function() {},
      register: function(options) { return Promise.reject(new Error("Passkeys on web require native browser WebAuthn.")); },
      login: function(options) { return Promise.reject(new Error("Passkeys on web require native browser WebAuthn.")); },
      cancelCurrentAuthenticatorOperation: function() {},
      isUserVerifyingPlatformAuthenticatorAvailable: function() { return Promise.resolve(false); },
      isConditionalMediationAvailable: function() { return Promise.resolve(false); },
      hasPasskeySupport: function() { return false; }
    };
    window.passkeys = window.PasskeyAuthenticator;
    // Defensive guard for DWDS and Flutter Web hot-reload DOM cleanup
    (function() {
      try {
        var origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (!child) return null;
          if (child.parentNode !== this) {
            if (child.parentNode) {
              return child.parentNode.removeChild(child);
            }
            return child;
          }
          return origRemoveChild.call(this, child);
        };
      } catch (e) {}
    })();
    window.addEventListener('error', function(event) {
      var msg = event && (event.message || (event.error && event.error.message)) || '';
      if (msg.indexOf("removeChild") !== -1 || msg.indexOf("Cannot read properties of null") !== -1) {
        if (event.preventDefault) event.preventDefault();
      }
    });
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event && (event.reason || event.detail);
      var text = reason ? (reason.message || String(reason)) : '';
      if (text.indexOf('Retry when online') !== -1 ||
          text.indexOf('Network unavailable') !== -1 ||
          text.indexOf('removeChild') !== -1 ||
          text.indexOf('VopApiException') !== -1) {
        if (event.preventDefault) event.preventDefault();
      }
    });
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var startup = document.getElementById('vop-startup');
      if (startup) startup.remove();
    }, {once:true});
  </script>
</head>
<body>
  <div id="vop-startup" role="status" aria-live="polite">
    <div class="intro"><div class="emblem" aria-hidden="true">✦</div>
    <strong>Voice of Prophecy</strong><p>Study the Word. Grow in faith.</p>
    <div class="pulse" aria-hidden="true"></div></div>
  </div>
  <script src="passkeys-bundle.js" type="application/javascript"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
